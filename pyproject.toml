[project]
name = "booking_service"
package-mode = false
version = "0.1.0"
description = ""
authors = [
    {name = "Vladimir",email = "vov.voron2005@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4"
dependencies = [
    "django (>=5.2.4,<6.0.0)",
    "django-environ (>=0.12.0,<0.13.0)",
    "gunicorn (>=23.0.0,<24.0.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "djangorestframework (>=3.16.0,<4.0.0)",
    "djangorestframework-stubs[compatible-mypy] (>=3.16.1,<4.0.0)",
    "pytest-dotenv (>=0.5.2,<0.6.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
ruff = "^0.12.3"
pre-commit = "^4.2.0"
mypy = "^1.16.1"
django-stubs = "^5.2.1"
pytest = "^8.4.1"
pytest-django = "^4.11.1"


[[tool.mypy.overrides]]
module = ["environ.*"]
follow_untyped_imports = true

[tool.mypy]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "booking_service.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "booking_service.settings"
python_files = "tests.py test_*.py *_tests.py"
addopts = "--no-migrations --reuse-db"

[tool.pytest.env]
env_files = [".env.testing"]
